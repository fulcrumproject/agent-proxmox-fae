name: CI

on:
    push:
        branches: [main]
        tags:
            - "v*"
    pull_request:
        branches: [main]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "^1.24"

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              run: go test -v ./... -coverprofile=coverage.out

            - name: Upload coverage
              uses: codecov/codecov-action@v4
              if: always()
              with:
                  file: ./coverage.out
                  fail_ci_if_error: false

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      artifact_name: fulcrum-proxmox-agent-linux-amd64
                    # Only build for linux amd64 for now
                    # - goos: linux
                    #   goarch: arm64
                    #   artifact_name: fulcrum-proxmox-agent-linux-arm64
                    # - goos: darwin
                    #   goarch: amd64
                    #   artifact_name: fulcrum-proxmox-agent-darwin-amd64
                    # - goos: darwin
                    #   goarch: arm64
                    #   artifact_name: fulcrum-proxmox-agent-darwin-arm64
        steps:
            - uses: actions/checkout@v5

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "^1.24"

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  go build -o ${{ matrix.artifact_name }} -ldflags="-s -w" ./cmd/agent

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_name }}
                  retention-days: 30

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: ./artifacts

            - name: Create checksums
              run: |
                  cd artifacts
                  find . -type f -name 'fulcrum-proxmox-agent*' -exec sha256sum {} \; > checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release ${github.ref_name}
                  files: |
                      artifacts/**/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
