name: CI

on:
    push:
        branches: [main]
        tags:
            - "v*"
    pull_request:
        branches: [main]

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: "^1.24"
                  cache-dependency-path: go.sum

            - name: Download dependencies
              run: go mod download

            - name: Run tests
              id: tests
              env:
                  INTEGRATION_TESTS: "0"
              run: go test -count=1 -v -coverpkg=./... -coverprofile=coverage.out ./...

            - name: Generate coverage reports
              id: coverage
              if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
              run: |
                  test -s coverage.out
                  go tool cover -func=coverage.out > coverage.txt
                  go tool cover -html=coverage.out -o coverage.html

            - name: Upload coverage reports
              id: coverage_artifact
              if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report-${{ github.run_attempt }}
                  path: |
                      coverage.out
                      coverage.txt
                      coverage.html
                  if-no-files-found: error
                  retention-days: 7

            - name: Publish coverage summary
              if: ${{ !cancelled() }}
              env:
                  TEST_OUTCOME: ${{ steps.tests.outcome }}
                  COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
                  COVERAGE_ARTIFACT_URL: ${{ steps.coverage_artifact.outputs.artifact-url }}
              run: |
                  {
                      echo "## Go code coverage"
                      echo
                      if [[ "$TEST_OUTCOME" == "success" && "$COVERAGE_OUTCOME" == "success" ]]; then
                          test -s coverage.txt
                          total=$(awk '$1 == "total:" { print $3 }' coverage.txt)
                          [[ "$total" =~ ^[0-9]+([.][0-9]+)?%$ ]]
                          printf '**Statements: %s**\n\n' "$total"
                          echo "All module packages, including unexecuted code at zero."
                          echo "Offline unit, HTTP-contract and handler tests; live FAE tests are excluded."
                          echo "No coverage percentage threshold is enforced."
                          echo
                          echo '<details><summary>Coverage by function</summary>'
                          echo
                          echo '```text'
                          cat coverage.txt
                          echo '```'
                          echo '</details>'
                      else
                          echo "Coverage incomplete: tests or report generation did not succeed. No total is published."
                      fi
                      if [[ -n "$COVERAGE_ARTIFACT_URL" ]]; then
                          echo
                          printf '[Download coverage reports (HTML, text, raw profile)](%s)\n' "$COVERAGE_ARTIFACT_URL"
                      fi
                  } >> "$GITHUB_STEP_SUMMARY"

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      artifact_name: fulcrum-proxmox-agent-linux-amd64
                    # Only build for linux amd64 for now
                    # - goos: linux
                    #   goarch: arm64
                    #   artifact_name: fulcrum-proxmox-agent-linux-arm64
                    # - goos: darwin
                    #   goarch: amd64
                    #   artifact_name: fulcrum-proxmox-agent-darwin-amd64
                    # - goos: darwin
                    #   goarch: arm64
                    #   artifact_name: fulcrum-proxmox-agent-darwin-arm64
        steps:
            - uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: "^1.24"
                  cache-dependency-path: go.sum

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
              run: |
                  go build -o ${{ matrix.artifact_name }} -ldflags="-s -w" ./cmd/agent

            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_name }}
                  retention-days: 30

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: build
        if: startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - name: Download release artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: fulcrum-proxmox-agent-*
                  path: ./artifacts

            - name: Create checksums
              run: |
                  cd artifacts
                  find . -type f -name 'fulcrum-proxmox-agent*' -exec sha256sum {} \; > checksums.txt

            - name: Create Release
              uses: softprops/action-gh-release@v3
              with:
                  name: Release ${{ github.ref_name }}
                  files: |
                      artifacts/**/*
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
